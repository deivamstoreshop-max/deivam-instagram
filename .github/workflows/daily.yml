name: Daily Instagram post
on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST
  workflow_dispatch:
    inputs:
      date:
        description: "Date to post (YYYY-MM-DD, IST). Leave empty for today."
        required: false
      mode:
        description: "check = test token only, dry = show caption only, post = publish"
        default: "post"
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Test token
        if: ${{ github.event.inputs.mode == 'check' }}
        env: { IG_TOKEN: "${{ secrets.IG_TOKEN }}", IG_USER_ID: "${{ secrets.IG_USER_ID }}" }
        run: python post.py --check
      - name: Pick date
        if: ${{ github.event.inputs.mode != 'check' }}
        id: d
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -z "$D" ]; then D=$(TZ=Asia/Kolkata date +%F); fi
          echo "date=$D" >> $GITHUB_OUTPUT
          P=$(python -c "import json;print((json.load(open('calendar.json',encoding='utf-8')).get('$D') or {}).get('prefix',''))")
          echo "prefix=$P" >> $GITHUB_OUTPUT
      - name: Dry run
        if: ${{ github.event.inputs.mode == 'dry' }}
        env: { IG_TOKEN: "x", IG_USER_ID: "x" }
        run: python post.py ${{ steps.d.outputs.date }} --dry
      - name: Render slides
        if: ${{ github.event.inputs.mode != 'check' && github.event.inputs.mode != 'dry' && steps.d.outputs.prefix != '' }}
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python render.py ${{ steps.d.outputs.date }} ${{ steps.d.outputs.prefix }}
      - name: Publish images to repo
        if: ${{ github.event.inputs.mode != 'check' && github.event.inputs.mode != 'dry' && steps.d.outputs.prefix != '' }}
        run: |
          git config user.name "deivam-bot"; git config user.email "bot@users.noreply.github.com"
          git add out; git commit -m "slides ${{ steps.d.outputs.date }}" || true
          git push; sleep 20
      - name: Post to Instagram
        if: ${{ github.event.inputs.mode != 'check' && github.event.inputs.mode != 'dry' && steps.d.outputs.prefix != '' }}
        env: { IG_TOKEN: "${{ secrets.IG_TOKEN }}", IG_USER_ID: "${{ secrets.IG_USER_ID }}" }
        run: python post.py ${{ steps.d.outputs.date }}
